[project]
name = "albert-em"
version = "1.0.0"
description = "EM algorithm for two-state model fitting in sensorimotor adaptation"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tasks]
test = "pytest tests/"
benchmark = "pytest tests/test_benchmark.py --benchmark-only"
example = "python examples/tutorial.py"

[dependencies]
python = ">=3.9,<3.13"
numpy = ">=1.20.0"
scipy = ">=1.7.0"
numba = ">=0.57.0"
ipykernel = ">=7.1.0,<8"
jupyter = ">=1.1.1,<2"

[feature.viz.dependencies]
matplotlib = ">=3.3.0"

[feature.dev.dependencies]
pytest = ">=7.0.0"
pytest-benchmark = ">=4.0.0"
ipython = ">=8.0.0"

[environments]
default = ["viz"]
dev = ["viz", "dev"]
