[project]
name = "albert-em"
version = "1.0.0"
description = "EM algorithm for two-state model fitting in sensorimotor adaptation"
authors = [
    {name = "Scott Albert", email = "salbert8@jhu.edu"},
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "numba>=0.57.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.3.0",
]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[project.urls]
Homepage = "https://github.com/Motor-Learning-Lab/albert-em-port"
Repository = "https://github.com/Motor-Learning-Lab/albert-em-port"
Issues = "https://github.com/Motor-Learning-Lab/albert-em-port/issues"
